<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06060b" />
  <meta name="apple-mobile-web-app-title" content="Loop" />
  <meta name="format-detection" content="telephone=no" />
  <title>Loop</title>
  <link rel="icon" href="assets/logo-icon.png" />
  <link rel="apple-touch-icon" href="assets/logo-icon.png" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body data-view="boot">
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Splash while the session loads -->
  <div class="boot" id="boot" aria-live="polite">
    <img src="assets/logo-rings.png" alt="" class="boot-logo" />
    <span class="boot-text">Loop</span>
  </div>

  <!-- Welcome / sign up / log in -->
  <div class="screen auth-screen" id="auth" hidden></div>

  <!-- Onboarding after sign-up -->
  <div class="screen onboard-screen" id="onboard" hidden></div>

  <!-- Signed-in app -->
  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="view"></main>
    </div>
    <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
